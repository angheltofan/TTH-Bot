; TTH Bot — M5Stack Core2 firmware
; ---------------------------------------------------------------------------
; PHASE 1: firmware application skeleton.
;
; Present: M5Unified init, startup diagnostics, the AudioBus ownership
; boundary, a cooperative non-blocking main loop, and host-side unit tests.
;
; Absent by design, until their phase: the robot face (3), push-to-talk
; behaviour (2), audio capture/playback (4), the conversation loop (5), and
; Wi-Fi / WebSocket / Gemini / Supabase (post-6). No such header is included
; anywhere in this project.
;
; ENVIRONMENTS
;
;   core2-touch  (default) -> hold-to-talk on M5.BtnB, the CENTER capacitive
;                             touch button below the display. The active
;                             development configuration.
;   core2-sw201            -> hold-to-talk on a normally-open SW201 wired
;                             between GPIO 33 and GND (internal pull-up,
;                             active low). Built every time so it cannot rot
;                             while the button is unavailable.
;   native                 -> host unit tests for lib/tth_core, which contains
;                             no hardware dependency of any kind.
;
; Nothing outside include/tth/Config.h differs between the two device builds.
;
; NOTE (this machine): the Windows username contains "&", which cmd.exe treats
; as a command separator and which breaks PlatformIO's unquoted linker paths.
; Set PLATFORMIO_CORE_DIR to an "&"-free path before building. See README.md.
; ---------------------------------------------------------------------------

[platformio]
default_envs = core2-touch

[env]
test_framework = unity

[device]
; Arduino-ESP32 2.0.x core: the combination the M5Stack Core2 board definition
; and M5Unified are best tested against.
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; M5Unified pulls in M5GFX automatically; do not list M5GFX separately or the
; two can resolve to mismatched versions.
lib_deps =
    m5stack/M5Unified@^0.2.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; Strict warnings are scoped to OUR sources only. Applied globally they also
; cover M5Unified/M5GFX, which emit several unused-variable warnings we cannot
; fix upstream and must not silence project-wide -- doing that would weaken the
; checks on our own code too.
build_src_flags =
    -Wall
    -Wextra
    -Werror

; The host tests are the only tests; running them on-target would need the
; device attached for no added coverage, since lib/tth_core has no hardware
; dependency to exercise.
test_ignore = *

[env:core2-touch]
extends = device
build_flags =
    ${device.build_flags}
    -DTTH_PTT_INPUT=TTH_PTT_TOUCH

[env:core2-sw201]
extends = device
build_flags =
    ${device.build_flags}
    -DTTH_PTT_INPUT=TTH_PTT_GPIO33

[env:native]
platform = native
; lib/tth_core and the tests are ours, so the strict flags apply globally here.
;
; -fuse-ld=bfd selects the BFD linker explicitly. It ships with every MinGW and
; GCC install as `ld.bfd`, so this is portable, and on this machine it is also
; the difference between linking and not: Avast quarantines `ld.exe` by name
; while leaving `ld.bfd.exe` alone. See README.md.
build_flags =
    -Wall
    -Wextra
    -Werror
    -fuse-ld=bfd
; Only lib/tth_core is portable. src/ is full of M5Unified and must not be
; compiled for the host -- that exclusion is what keeps the "portable code
; contains no hardware dependency" rule honest rather than aspirational.
build_src_filter = -<*>
